# Buffer formats and shadow constants are declared in GLSL, as required by Iris.
oldLighting=false
oldHandLight=false
size.buffer.colortex5=0.5 0.5
size.buffer.colortex2=0.5 0.5
vignette=false
underwaterOverlay=false
shadowTranslucent=false
screen = <profile> [LIGHTING] [SHADOWS] [WATER] [POST] [ATMOSPHERE] [CLOUDS]
screen.LIGHTING = TORCH_STRENGTH MIN_CAVE_LIGHT NIGHT_FLAT_LIGHT EMISSIVE_BOOST DYNAMIC_LIGHT DYNAMIC_FLICKER END_PINK_LIGHT
screen.SHADOWS = shadowMapResolution shadowDistance SHADOW_STRENGTH SHADOW_FILTER
screen.WATER = WATER_REFLECTION WATER_DENSITY UNDERWATER_DENSITY WATER_CAUSTICS UNDERWATER_DISTORTION UNDERWATER_RAYS UNDERWATER_RAY_STEPS
screen.POST = BLOOM_STRENGTH EXPOSURE SATURATION VIBRANCE VIGNETTE FXAA
screen.ATMOSPHERE = WIND_STRENGTH FOG_DENSITY SUN_RAYS SUN_RAY_STEPS RAIN_OPACITY AURORA AURORA_STRENGTH AURORA_SPEED END_STARS END_NEBULA
screen.CLOUDS = CLOUD_STYLE CLOUD_STEPS CLOUD_COVERAGE CLOUD_HEIGHT CLOUD_SPEED
sliders = SUN_RAYS END_PINK_LIGHT SHADOW_STRENGTH TORCH_STRENGTH MIN_CAVE_LIGHT NIGHT_FLAT_LIGHT EMISSIVE_BOOST DYNAMIC_LIGHT WIND_STRENGTH WATER_REFLECTION WATER_DENSITY UNDERWATER_DENSITY WATER_CAUSTICS UNDERWATER_DISTORTION UNDERWATER_RAYS RAIN_OPACITY BLOOM_STRENGTH EXPOSURE SATURATION VIBRANCE VIGNETTE FOG_DENSITY CLOUD_COVERAGE CLOUD_HEIGHT CLOUD_SPEED AURORA_STRENGTH AURORA_SPEED
profile.PERFORMANCE = shadowMapResolution:512 shadowDistance:48.0 SHADOW_FILTER:0 BLOOM_STRENGTH:0.08 FXAA:1 CLOUD_STEPS:8 UNDERWATER_RAY_STEPS:8 SUN_RAY_STEPS:8
profile.BALANCED = shadowMapResolution:1024 shadowDistance:64.0 SHADOW_FILTER:1 BLOOM_STRENGTH:0.14 FXAA:2 CLOUD_STEPS:12 UNDERWATER_RAY_STEPS:12 SUN_RAY_STEPS:12
profile.QUALITY = shadowMapResolution:2048 shadowDistance:96.0 SHADOW_FILTER:2 BLOOM_STRENGTH:0.2 FXAA:3 CLOUD_STEPS:20 UNDERWATER_RAY_STEPS:20 SUN_RAY_STEPS:20
